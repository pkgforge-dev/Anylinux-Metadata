name: "PR Validation & Visual Preview"

on:
  pull_request:
    paths:
      - "apps/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Schema Tests
        run: bun test

      - name: Validate All Application Manifests
        run: bun run validate

      - name: Compile Downstream Distribution Catalog
        run: bun run export

      - name: Generate PR Visual Preview Card
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find changed app files
            const appsDir = path.resolve('apps');
            const files = fs.readdirSync(appsDir).filter(f => f.endsWith('.json'));
            
            let comment = `### AnyLinux Metadata Verification Report\n\n`;
            comment += `**Status:** All schema validations and unit tests passed.\n\n`;

            for (const file of files.slice(0, 3)) {
              try {
                const data = JSON.parse(fs.readFileSync(path.join(appsDir, file), 'utf8'));
                const meta = data.appstream.metadata;
                const media = data.appstream.media;
                
                comment += `#### Application Card: **${meta.name}** (\`${file}\`)\n\n`;
                comment += `| Icon | Details |\n`;
                comment += `| :---: | :--- |\n`;
                comment += `| <img src="${media.icon}" width="64" height="64" /> | **ID:** \`${meta.id}\`<br/>**Summary:** ${meta.summary}<br/>**License:** \`${meta.projectLicense}\` \| **Categories:** \`${meta.categories.join(', ')}\`<br/>**Developer:** [${meta.developer.name}](${meta.developer.url || meta.homepage}) |\n\n`;
                
                if (media.screenshots && media.screenshots.length > 0) {
                  comment += `<details><summary><b>View Screenshot (${media.screenshots[0].caption})</b></summary>\n\n<img src="${media.screenshots[0].source}" width="400" />\n\n</details>\n\n`;
                }
              } catch (e) {}
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
