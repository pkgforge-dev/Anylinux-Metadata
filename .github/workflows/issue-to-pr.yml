name: "Convert Issue Form to Pull Request"

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert-issue:
    if: |
      contains(github.event.issue.labels.*.name, 'automated-pr') ||
      contains(github.event.issue.labels.*.name, 'app-update') ||
      contains(github.event.issue.labels.*.name, 'app-submission') ||
      startsWith(github.event.issue.title, 'fix(app):') ||
      startsWith(github.event.issue.title, 'feat(app):') ||
      contains(github.event.issue.body, '### Application Slug')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Parse Issue Body & Generate Manifest
        id: parse
        run: bun run scripts/parse-issue.ts
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Validate
        run: bun run validate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "${{ github.event.issue.title }}"
          title: "${{ github.event.issue.title }}"
          body: |
            Closes #${{ github.event.issue.number }}
            Submitted via GitHub Issue Form by @${{ github.event.issue.user.login }}.
          branch: "issue-${{ github.event.issue.number }}"
          base: main
